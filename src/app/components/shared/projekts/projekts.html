<section>
    <article *ngFor="let project of projekts"[routerLink]="['/projekts', project.id]">
        <div class="image-container">
            <img [src]="project.image">
            <app-to-form-btn btnName="Project details" class="btn"></app-to-form-btn>
            <div class="gradient"></div>
        </div>
        <h1>{{ project.title }}</h1>
        <p>{{ project.description }}</p>
    </article>
</section>
