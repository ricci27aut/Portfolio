                </div>
                <div class="poll-container">
                    <h1 class="hover-title">

            <div class="landing-content secent-title-section">

                    <span>E</span>

                    <span>L</span>
                    <span>O</span>
                    <span>P</span>

        </div>

        <div class="social-icons">
